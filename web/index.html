<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Three.js SplatMesh Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
      width: 100vw;
      min-height: 100vh;
      min-width: 100vw;
      background: #000;
      margin: 0px;
    }

    #controls {
      margin-top: 12px;
      margin-bottom: 12px;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 12px;
      padding: 18px 32px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      display: none;
      flex-direction: row;
      gap: 32px;
      align-items: center;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 1.1em;
    }
    #controls label {
      margin-right: 8px;
      font-weight: 500;
    }
    #controls input[type="range"] {
      width: 160px;
      accent-color: #4f8cff;
      margin: 0 12px 0 0;
      vertical-align: middle;
      background: transparent;
    }
    #controls span {
      display: inline-block;
      min-width: 3.5em;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #b2d1ff;
    }

    #container {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100%;
    }

    /* Back-to-gallery button: top left, next to the fps counter. */
    #gallery-btn {
      position: fixed;
      top: 10px;
      left: 92px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(20, 22, 28, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      color: #f2f4f8;
      font: 600 14px/1 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
      letter-spacing: 0.02em;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    #gallery-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      opacity: 0.9;
    }
    #gallery-btn:hover {
      background: rgba(79, 140, 255, 0.85);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }
    #gallery-btn:active {
      transform: translateY(0);
    }
    /* 360 panoramas: control hints (desktop). */
    #pano-help {
      position: fixed; left: 12px; bottom: 12px; z-index: 1000; max-width: calc(100vw - 24px);
      padding: 8px 12px; border-radius: 10px; background: rgba(20, 22, 28, 0.6); color: #cfd6df;
      font: 13px/1.4 'Segoe UI', system-ui, sans-serif; backdrop-filter: blur(8px); pointer-events: none;
    }
    #gallery-btn:focus-visible {
      outline: 2px solid #4f8cff;
      outline-offset: 2px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.178.0/three.module.js",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/0.1.10/spark.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/controls/OrbitControls.min.js"
    }
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/stats-js@1.0.1/build/stats.min.js"></script>
</head>

<body>
  <div id="container"></div>
  <a id="gallery-btn" href="/list" title="Back to the scene gallery">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Gallery</span>
  </a>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
    import { SplatMesh, dyno } from "@sparkjsdev/spark";
    import * as dat from "https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.module.js";
    import { PLYLoader } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/PLYLoader.min.js";
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/GLTFLoader.min.js';
    import { KTX2Loader } from 'https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/KTX2Loader.js';
  import { SparkRenderer } from "@sparkjsdev/spark";
    import { XRSceneController } from "/js/XRSceneController.js";
    import { XRGallery, XRToast } from "/js/XRGallery.js";
    import { setupBench } from "/js/xrBench.js";
    import { createFlatSplats } from "/js/splatFlat.js";
    import { PanoLook, setupMsi } from "/js/panoView.js";
    import { createDepthWarp, estimatePivot } from "/js/depthWarp.js";
    import { ARButton } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/webxr/ARButton.js";
    import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/loaders/FontLoader.js";
    import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/geometries/TextGeometry.js";

    const stats = new Stats();
    // const offset = [0, -2, -5];
    const offset = [0, 0, 0];

    stats.showPanel(0); // 0: fps, 1: ms, 2: mb, 3+: custom
    document.body.appendChild(stats.dom);

    // Get scene from URL (?scene=...) or use default
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    // MPI-surf view modes (surf, surf2, ...): <scene>_mpionly_<mode>.glb, no mesh.
    // Any other ?lod is an MPI-only variant bake: <scene>_mpionly_<lod>.glb (surf*, ldi, ad25, u512, p256, ...;
    // listed in the model picker), no mesh. So every bake can be compared with ?lod=a,b,c.
    const BASE_LODS = ['full', 'hybrid', 'mpi', 'mpionly', 'layers', 'surfaces', 'patches', 'quest'];
    const isVariant = (lod) => !!lod && /^[a-z0-9]+$/i.test(lod) && !BASE_LODS.includes(lod);
    // ?lod=a,b[,c,d]: compare view modes on the desktop, side by side (two or three) or in a 2x2 grid (four),
    // all seen through the one camera (synced). The first mode is the scene's mode otherwise (and in XR).
    const lodList = (getQueryParam('lod') || 'mpionly').split(',').filter(Boolean).slice(0, 4);
    const cmpCols = lodList.length === 4 ? 2 : lodList.length, cmpRows = lodList.length === 4 ? 2 : 1;
    // Files of a scene: public scenes under /output2/, private ones ("private:<name>", served only after
    // logging in) under /c/private/output2/ (collections.js, web.js).
    function sceneBase(scene) {
      return scene.startsWith('private:') ? `/c/private/output2/${scene.slice('private:'.length)}`
                                          : `../output2/${scene}`;
    }
    // Default scene when ?scene= is missing; hybrid mode needs one with _pruned.ply + _mesh.glb.
    let file = getQueryParam('scene') ||
      (getQueryParam('hybrid') === "true" ? "20241215_194034" : "20251023_155037");
    let plyURL = `${sceneBase(file)}.ply`;
    let jsonURL = `${sceneBase(file)}.json`;

    // plyURL = 'http://localhost:8000/data/moth/moth.ply';

    // 360 panoramas (docs/pano-360.md): scene "pano:<name>", shown as a multi-sphere image (?pmode=msi, default)
    // or splats (?pmode=splats); ?pvariant=<dir> picks an MSI variant (default: the server's first).
    // Desktop: look-around controls instead of orbiting; XR: centred on the head, snap turn, no scaling.
    const isPanoScene = (s) => typeof s === 'string' && /^(private:)?pano:/.test(s);
    const isPano = isPanoScene(file);   // the page's own scene; XR can step to other kinds without a reload
    let panoMode = getQueryParam('pmode') === 'splats' ? 'splats' : 'msi';
    let panoVariant = getQueryParam('pvariant') || null;
    const PANO_MODES = [{ id: 'msi', label: '360 MSI' }, { id: 'splats', label: '360 splats' }];

    let ui = getQueryParam('ui') || "true";
    let hybrid = getQueryParam('hybrid') || "false";

    // let width = 4000;
    // let height = 3000;
    let meta = {};

    if (isPano) {
      // No photo camera: fill the window, 75 deg vertical FOV (depth fields only feed the photo GUI).
      const c = document.getElementById('container');
      meta = { width: c.clientWidth, height: c.clientHeight, vertical_fov_degrees: 75, focal_length_px: 500,
               min_depth: 1, max_depth: 10, percentile_1_depth: 1, percentile_99_depth: 10 };
    } else await fetch(jsonURL)
      .then(response => {
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error('File not found (404)');
          } else {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
        }
        return response.json();
      })
      .then(meta_in => {
        meta = meta_in;
      })
      .catch(error => {
        console.error('Fetch error:', error);
        meta.width = 2000;
        meta.height = 2000;
        meta.vertical_fov_degrees = 30;
        meta.focal_length_px = 3732;

        meta.min_depth = -1.2954319715499878;
        meta.max_depth = 1.1049436330795288;
        meta.mean_depth = -0.48250031354417233;
        meta.median_depth = -0.5307648663832427;
        meta.percentile_1_depth = -1.222677595050114;
        meta.percentile_99_depth = 0.734249217098667;

        // These depth are positive values going away from the camera.
        meta.min_depth = meta.min_depth - offset[2]
        meta.max_depth = meta.max_depth - offset[2]
        meta.mean_depth = meta.mean_depth - offset[2]
        meta.median_depth = meta.median_depth - offset[2]
        meta.percentile_1_depth = meta.percentile_1_depth - offset[2]
        meta.percentile_99_depth = meta.percentile_99_depth - offset[2]

        // meta.width = 2000;
        // meta.height = 2000;
        // meta.focal_length_px = 3322;
        // meta.vertical_fov_degrees 

      });

    let width = meta.width, height = meta.height;
    let ratio = width / height;
    if (!isPano) { width *= cmpCols; height *= cmpRows; }   // comparison panels, each at the photo's aspect
    const fitRatio = width / height;
    // let innerWidth = window.innerWidth;
    // let innerHeight = window.innerHeight;
    const container = document.getElementById('container');
    const innerWidth = container.clientWidth;
    const innerHeight = container.clientHeight;

    let usableWidth = innerWidth; 
    let usableHeight = innerHeight; 

    if (usableWidth < width) {
      width = usableWidth;
      height = width / fitRatio;
    }
    if (usableHeight < height) {
      height = usableHeight;
      width = height * fitRatio;
    }

    let linspace = [];
    let numPoints = 100;
    for (let i = 0; i < numPoints; i++) {
      let t = i / (numPoints - 1);
      // let value = (1-t) / meta.percentile_1_depth + t / meta.percentile_99_depth;
      let value = (1-t) / meta.min_depth + t / meta.max_depth;
      linspace.push(value);
    }

    // const width = window.innerWidth;
    // const height = window.innerHeight;

    const scene = new THREE.Scene();
    // const camera = new THREE.PerspectiveCamera(54.88, ratio, 0.1, 1000);
    const camera = new THREE.PerspectiveCamera(meta.vertical_fov_degrees, ratio, 0.1, 1000);

    // const renderer = new THREE.WebGLRenderer({ alpha: true });
    // alpha is needed so the Quest passthrough shows behind the splats in AR;
    // the page background is black, so desktop looks unchanged.
    const renderer = new THREE.WebGLRenderer({ alpha: true });
    renderer.setClearColor(0x000000, 0);
    // renderer.setClearColor(0xFF0000, 1); // 0 alpha for full transparency
    renderer.setPixelRatio(2);
    // alert( window.devicePixelRatio );
    // renderer.setPixelRatio(2);
    renderer.setSize(width, height);
    document.getElementById('container').appendChild(renderer.domElement)

    // --- WebXR AR (e.g. Meta Quest 3 passthrough) ---
    // 'local' reference space puts the origin at the head pose when the session
    // starts, so the scene appears in front of you exactly as the source camera saw it.
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');

    // XR performance knobs (URL-overridable). Splat rendering on Quest is mostly
    // fill-rate bound, so cut pixels: lower eye-buffer resolution, fixed foveated
    // rendering, and a tighter Gaussian cutoff (sqrt(8) -> sqrt(5) shrinks each
    // splat quad's area by ~37% while dropping only its faintest tail).
    // Eye-buffer resolution: default 1.4x for the MPI views (the Quest 3 grants 2352x2464 per eye and holds 120 Hz;
    // the extra pixels remove texture aliasing without softening), 1.0 for the splat views (splat-count bound).
    // It can't change mid-session. No fixed foveation by default.
    const xrScale = parseFloat(getQueryParam('xrscale')
      || ((isPano ? panoMode === 'msi' : (['mpi', 'mpionly'].includes(lodList[0]) || isVariant(lodList[0]))) ? '1.4' : '1'));
    const xrFoveation = parseFloat(getQueryParam('foveation') || '0');
    const xrStdDev = parseFloat(getQueryParam('xrstddev') || String(Math.sqrt(5)));
    // Close-up scenes cost more: their photos are wider-angle (the scene fills
    // more of the headset's view) with more large splats, and leaning in grows
    // splats further. These cap or avoid that:
    // - xrmaxpx: max splat radius on screen (Spark's maxPixelRadius; 512 default).
    // - adaptive=1: lower splat extent, size cap and foveation when frames
    //   drop, restore them when there's headroom (eye-buffer resolution can't
    //   change during a WebXR session).
    const xrMaxPx = parseFloat(getQueryParam('xrmaxpx') || '512');
    const xrAdaptive = getQueryParam('adaptive') === '1';
    renderer.xr.setFramebufferScaleFactor(xrScale);
    renderer.xr.setFoveation(xrFoveation);
    // AR: three.js's stock ARButton, exactly as img3dviewer starts AR
    // (immersive-ar + dom-overlay, 'local' reference space). Our earlier custom
    // AR request (only 'local', no dom-overlay) made the Quest 3 switch to its
    // roomscale boundary; with this request, stationary mode sticks (tested on
    // the headset).
    // VR: our own button, requesting only 'local' (three's VRButton would also
    // ask for bounded-floor, which may pull the Quest towards roomscale).
    document.body.appendChild(ARButton.createButton(renderer));
    document.body.appendChild(createVRButton(renderer));

    function createVRButton(renderer) {
      const button = document.createElement('button');
      Object.assign(button.style, {
        position: 'absolute', bottom: '20px', left: 'calc(50% - 237px)', width: '150px',
        padding: '12px 6px', border: '1px solid #fff', borderRadius: '4px',
        background: 'rgba(0,0,0,0.1)', color: '#fff', font: 'normal 13px sans-serif',
        textAlign: 'center', opacity: '0.5', outline: 'none', zIndex: 999, cursor: 'pointer',
      });
      button.textContent = 'ENTER VR';
      if (!navigator.xr) {
        button.textContent = 'VR NEEDS HTTPS';
        button.disabled = true;
        return button;
      }
      button.disabled = true;
      navigator.xr.isSessionSupported('immersive-vr').catch(() => false).then((ok) => {
        button.disabled = !ok;
        if (!ok) button.textContent = 'VR NOT SUPPORTED';
      });
      button.onmouseenter = () => { button.style.opacity = '1.0'; };
      button.onmouseleave = () => { button.style.opacity = '0.5'; };
      let session = null;
      button.onclick = async () => {
        if (session) { session.end(); return; }
        if (renderer.xr.isPresenting) return;  // an AR session is running
        try {
          session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local'] });
          renderer.xr.setReferenceSpaceType('local');
          await renderer.xr.setSession(session);
          button.textContent = 'EXIT VR';
          session.addEventListener('end', () => { session = null; button.textContent = 'ENTER VR'; });
        } catch (e) {
          console.warn('Failed to start immersive-vr:', e);
          session = null;
          button.textContent = 'VR FAILED (see console)';
        }
      };
      return button;
    }

    // All scene content goes under xrRoot (placed/moved/scaled in AR) and its
    // child xrContent (rotated by hand with the XR controller).
    const xrRoot = new THREE.Group();
    const xrContent = new THREE.Group();
    xrRoot.add(xrContent);




    const spark = new SparkRenderer({
      renderer,
      view: {
        sort32: true,       // float32 sorting
        sortRadial: false,  // sort by Z instead of radial
      },
    });

    // Sort once: the default view normally re-sorts whenever the camera moves
    // (constantly, with head tracking). Pinning its sort pose to a fixed object at
    // the original capture camera means it sorts only when the splats change
    // (load / re-place), not per frame. Toggle "sortOnce" in the GUI to compare.
    const sortCamera = new THREE.Object3D();  // origin, looking down -z
    function setSortOnce(on) {
      spark.defaultView.camera = on ? sortCamera : undefined;
    }

    // 3) Add SparkRenderer to the scene
    scene.add(spark);
    scene.add(xrRoot);
    xrContent.add(sortCamera);
    setSortOnce(true);
    // Panoramas surround the viewer: sort by distance in every direction (sort360), not by depth in front.
    function setSortPano(on) {
      spark.defaultView.sort360 = on;
      spark.defaultView.sortRadial = on;
    }
    setSortPano(isPano);

    const desktop = { stdDev: spark.maxStdDev, maxPx: spark.maxPixelRadius };
    renderer.xr.addEventListener('sessionstart', () => {
      Object.assign(desktop, { stdDev: spark.maxStdDev, maxPx: spark.maxPixelRadius });
      adapt.q = 1;
      applyQuality(1);
    });
    renderer.xr.addEventListener('sessionend', () => {
      spark.maxStdDev = desktop.stdDev;
      spark.maxPixelRadius = desktop.maxPx;
    });

    // Quality level q in [0, 1]: 1 = the settings above; lower trades splat
    // softness, size cap and periphery sharpness for speed.
    const adapt = { q: 1, lastT: 0, dts: [], lastStep: 0 };
    function applyQuality(q) {
      spark.maxStdDev = Math.min(xrStdDev, 1.8) + (xrStdDev - Math.min(xrStdDev, 1.8)) * q;
      spark.maxPixelRadius = Math.min(xrMaxPx, 32) + (xrMaxPx - Math.min(xrMaxPx, 32)) * q;
      renderer.xr.setFoveation(1 - (1 - xrFoveation) * q);
    }
    // Every ~30 frames, compare the median frame time with the headset's
    // frame rate: step down fast when too slow, step back up slowly.
    function adaptQuality(now) {
      if (!xrAdaptive || !renderer.xr.isPresenting) { adapt.lastT = 0; adapt.dts.length = 0; return; }
      if (adapt.lastT) adapt.dts.push(now - adapt.lastT);
      adapt.lastT = now;
      if (adapt.dts.length < 30) return;
      const dt = adapt.dts.sort((a, b) => a - b)[adapt.dts.length >> 1];
      adapt.dts.length = 0;
      const target = 1000 / (renderer.xr.getSession()?.frameRate || 72);
      if (dt > target * 1.15 && adapt.q > 0) {
        adapt.q = Math.max(0, adapt.q - 0.15);
      } else if (dt < target * 1.05 && adapt.q < 1 && now - adapt.lastStep > 2000) {
        adapt.q = Math.min(1, adapt.q + 0.05);
      } else {
        return;
      }
      adapt.lastStep = now;
      applyQuality(adapt.q);
    }

    // Draw splats without instancing, one triangle each (web/js/splatFlat.js):
    // same shader maths, order and image as Spark's instanced quads; on Quest 3
    // 34 -> 48 fps from dropping instancing, -> 55 fps with triangles.
    // ?splatdraw=instanced keeps Spark's own drawing; ?splatdraw=quads uses
    // non-instanced quads (both for comparison).
    const splatDraw = getQueryParam('splatdraw');
    const flatSplats = splatDraw === 'instanced' ? null
      : createFlatSplats(THREE, spark, { corners: splatDraw === 'quads' ? 4 : 3 });
    if (flatSplats) {
      scene.add(flatSplats.mesh);
      flatSplats.set(true);
    }

    // Device info for the FPS log, so reports from the Quest, a phone and a desktop can be told apart.
    function deviceInfo() {
      const ua = navigator.userAgent;
      const device = /OculusBrowser|Quest|Pacific/i.test(ua) ? 'quest'
                   : /Android|iPhone|iPad|Mobile/i.test(ua) ? 'phone' : 'desktop';
      const s = renderer.xr.getSession();
      const layer = renderer.xr.getBaseLayer?.();
      return {
        device,
        xrMode: s ? (s.environmentBlendMode === 'opaque' ? 'vr' : 'ar') : null,
        refreshHz: s?.frameRate ?? null,
        fb: (layer?.framebufferWidth ?? layer?.textureWidth)
          ? `${layer.framebufferWidth ?? layer.textureWidth}x${layer.framebufferHeight ?? layer.textureHeight}` : null,
      };
    }

    // Self-running XR benchmark (?bench=<name>, see web/js/xrBench.js); its
    // phases are logged instead of the periodic FPS reports.
    const benchName = getQueryParam('bench');
    const xrBench = benchName ? setupBench(benchName, {
      renderer, flatSplats,
      report: (fields) => fetch('/fps', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ scene: file, lod: lodMode, tex: texKtx2 ? 'ktx2' : 'png', splats: countSplats(splat),
                               xrScale, ...deviceInfo(), ...fields }),
      }).catch(() => {}),
      // bench=views: show one (scene, lod, tex) in place, re-centred in front of the viewer.
      loadView: async ({ scene, lod, tex, mpivar }) => {
        lodMode = lod;
        texKtx2 = tex === 'ktx2';
        mpivarCur = mpivar || '';
        await stepScene(0, scene);
        xrController.resetPlacement();
      },
      onPhase: (text, seconds) => xrToast.show(text, seconds),
      scenes: (getQueryParam('benchscenes') || '').split(',').filter(Boolean),
      currentScene: file,
    }) : null;

    // Diagnostics for the FPS reports: how often Spark rebuilds its splat data
    // (needs a new accumulator) and re-sorts (GPU readback + sort). Both are
    // expensive; with sortOnce they should be rare, not per frame.
    const sparkStats = { rebuilds: 0, sorts: 0, cpuMs: [], sparkMs: 0, frames: 0 };
    {
      // CPU time Spark spends preparing draws (called once per eye per frame).
      const sparkBeforeRender = spark.onBeforeRender.bind(spark);
      spark.onBeforeRender = (...a) => {
        const t = performance.now();
        sparkBeforeRender(...a);
        sparkStats.sparkMs += performance.now() - t;
      };
      const allocAccumulator = spark.maybeAllocAccumulator.bind(spark);
      spark.maybeAllocAccumulator = (...a) => { sparkStats.rebuilds++; return allocAccumulator(...a); };
      const view = spark.defaultView;
      const sortUpdate = view.sortUpdate.bind(view);
      view.sortUpdate = (...a) => { sparkStats.sorts++; return sortUpdate(...a); };
    }

    // Headset FPS can't be seen in the page during XR, so report it to the
    // server console (node web.js) every 2 s.
    let fpsFrames = 0, fpsStart = performance.now();
    function reportXRFps() {
      if (xrBench) return;  // the benchmark logs per phase instead
      if (!renderer.xr.isPresenting) { fpsFrames = 0; fpsStart = performance.now(); return; }
      fpsFrames++;
      const elapsed = performance.now() - fpsStart;
      if (elapsed < 2000) return;
      const fps = fpsFrames * 1000 / elapsed;
      fpsFrames = 0; fpsStart = performance.now();
      fetch('/fps', {
        method: 'POST', headers: {'Content-Type': 'application/json'},

              : 'uniform sampler2D map; uniform float lodBias; varying vec2 vUv; ' +
                'void main() { vec4 c = texture2D(map, vUv, lodBias); ' + plainOut + ' }',
            side: THREE.DoubleSide, transparent: true, depthWrite: false,
            blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
            blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
          });
          child.renderOrder = 100 - Number(k[1]);  // back surfaces first
        });
        group.add(model);
      }
      return group;
    }

    // Splat count of whatever content is loaded (for FPS reports).
    function countSplats(obj) {
      let n = 0;
      obj.traverse((child) => { if (child instanceof SplatMesh) n += child.numSplats ?? 0; });
      return n;
    }

    async function loadContent(scene) {
      if (isPanoScene(scene)) return loadPano(scene);
      setSortPano(false);
      if (lodMode === 'hybrid') {
        const url = `${sceneBase(scene)}${hybridName}.glb`;
        try {
          if ((await fetch(url, { method: 'HEAD' })).ok) return await loadHybrid(scene);
        } catch (e) {
          console.error(`Failed to load ${url}:`, e);
        }
        console.warn(`No ${url}; using full splats.`);
      }
      if (['surfaces', 'patches', 'mpi', 'mpionly'].includes(lodMode) || isVariant(lodMode)) {
        // MPI-surf (?lod=surf): MPI-only made of surface pieces, <scene>_mpionly_surf.glb (bake: SURF=1, see
        // surface_pieces() in scripts/eval_alpha_patches.py). ?mpivar=<tag>: an experimental MPI-only bake,
        // <scene>_mpionly_<tag>.glb (comparisons in the headset).
        const mpivar = isVariant(lodMode) ? lodMode
          : lodMode === 'mpionly' && mpivarCur;
        const suffix = (isVariant(lodMode) ? '_mpionly' : `_${lodMode}`) + (mpivar ? `_${mpivar}` : '');
        const url = `${sceneBase(scene)}${suffix}.glb`;
        try {
          if ((await fetch(url, { method: 'HEAD' })).ok) return await loadSurfaces(scene, suffix, lodMode !== 'mpionly' && !isVariant(lodMode));
        } catch (e) {
          console.error(`Failed to load ${url}:`, e);
        }
        console.warn(`No ${url}; using full splats.`);
      }
      if (lodMode === 'layers') {
        const url = `${sceneBase(scene)}_layers.glb`;
        try {
          if ((await fetch(url, { method: 'HEAD' })).ok) return await loadLayers(url);
        } catch (e) {
          console.error(`Failed to load ${url}:`, e);
        }
        console.warn(`No ${url}; using full splats.`);
      }
      const s = createSplat(await splatUrlFor(scene));
      await s.initialized;
      return s;
    }

    // Apply the GUI's showSplat / showMesh checkboxes to loaded content:
    // SplatMeshes follow showSplat, every other mesh (hybrid mesh, baked
    // layers) follows showMesh. Set per object, not on the parent group, so
    // hiding one part of a hybrid scene leaves the other visible.
    function applyVisibility(obj) {
      if (!obj) return;
      obj.traverse((child) => {
        if (child instanceof SplatMesh) child.visible = guiParams.showSplat;
        else if (child.isMesh) child.visible = guiParams.showMesh;
      });
    }

    function disposeContent(obj) {
      obj.traverse((child) => {
        if (child instanceof SplatMesh) { child.dispose(); return; }
        if (!child.isMesh) return;
        child.geometry.dispose();
        child.material.map?.dispose();
        child.material.dispose();
      });
    }

    let splat;
    if (hybrid === "true") {
      splat = createSplat(splatURL);
    } else if (isPano || ['layers', 'hybrid', 'surfaces', 'patches', 'mpi', 'mpionly'].includes(lodMode) || isVariant(lodMode)) {
      splat = await loadContent(file);
    } else {
      splat = createSplat(splatURL);  // shows progressively while loading
    }
    xrContent.add(splat);

    // --- Per-scene view settings: size in XR, depth scale and offset (web/js/depthWarp.js; left controller
    // trigger / grip in XR, sliders on the desktop). Saved per scene on the server (/view-config, inside the
    // scene's collection) and restored whenever the scene is shown.
    const depthWarp = createDepthWarp(THREE, dyno, SplatMesh);
    window.__dbg.depthWarp = depthWarp;
    const VIEW_DEFAULTS = { scale: 1, depthScale: 1, depthOffset: 0 };
    let viewCfg = { ...VIEW_DEFAULTS };
    let viewScene = file;                    // the scene viewCfg belongs to
    async function loadViewConfig(name) {
      try { return { ...VIEW_DEFAULTS, ...(await (await fetch(`/view-config/${encodeURIComponent(name)}`)).json()) }; }
      catch (e) { return { ...VIEW_DEFAULTS }; }
    }
    let saveTimer = null;
    function saveViewConfig() {
      clearTimeout(saveTimer);
      const name = viewScene, body = JSON.stringify(viewCfg);
      saveTimer = setTimeout(() => fetch(`/view-config/${encodeURIComponent(name)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
      }).catch(() => {}), 500);
    }
    // Depth always; the size only in XR (panoramas keep their true size).
    function applyViewConfig() {
      depthWarp.set({ scale: viewCfg.depthScale, offset: viewCfg.depthOffset });
      if (renderer.xr.isPresenting) xrRoot.scale.setScalar(isPanoScene(viewScene) ? 1 : viewCfg.scale);
    }
    const viewLabel = () => `Depth ×${viewCfg.depthScale.toFixed(2)}, offset ${viewCfg.depthOffset >= 0 ? '+' : ''}` +
                            `${viewCfg.depthOffset.toFixed(2)} m`;
    /** New content: warp it, load its scene's settings and set the depth pivot (a typical depth). */
    async function prepareView(content, name) {
      depthWarp.attach(content);
      viewScene = name;
      const radial = isPanoScene(name);
      const [cfg, pivot] = await Promise.all([loadViewConfig(name), estimatePivot(THREE, SplatMesh, content, radial)]);
      if (viewScene !== name) return;        // another scene was loaded meanwhile
      viewCfg = cfg;
      depthWarp.set({ radial, pivot });
      applyViewConfig();
    }
    splat.userData.scene = file;
    prepareView(splat, file).catch((e) => console.warn('View settings failed:', e));

    // Comparison panels (?lod=a,b,...): the other modes' content of this scene, warped like the first, each
    // drawn alone into its part of the canvas (renderPanels). Desktop only; XR shows the first mode.
    const cmpPanels = [];                    // [{ content, lod }] after the first mode's
    const cmpLabels = [];
    if (!isPano && lodList.length > 1) {
      lodList.forEach((lod) => {
        const el = document.createElement('div');
        el.textContent = (VIEW_MODES.find((m) => m.id === lod) || { label: lod }).label;
        Object.assign(el.style, { position: 'fixed', zIndex: 999, padding: '3px 8px', borderRadius: '4px',
                                  background: 'rgba(0,0,0,0.55)', color: '#fff', font: '13px sans-serif',
                                  pointerEvents: 'none' });
        document.body.appendChild(el);
        cmpLabels.push(el);
      });
      (async () => {
        for (const lod of lodList.slice(1)) {
          lodMode = lod;
          try {
            const c = await loadContent(file);
            c.userData.scene = file;
            depthWarp.attach(c);
            applyVisibility(c);
            c.visible = false;
            xrContent.add(c);
            cmpPanels.push({ content: c, lod });
          } catch (e) {
            console.warn(`Comparison view ${lod} failed:`, e);
          } finally {
            lodMode = lodList[0];
          }
        }
      })();
    }
    const panelSize = new THREE.Vector2();
    function renderPanels() {
      const all = [{ content: splat }, ...cmpPanels];
      renderer.getSize(panelSize);
      const pw = panelSize.x / cmpCols, ph = panelSize.y / cmpRows;
      const rect = renderer.domElement.getBoundingClientRect();
      renderer.setScissorTest(true);
      for (let i = 0; i < cmpCols * cmpRows; i++) {
        const col = i % cmpCols, row = Math.floor(i / cmpCols);
        const y = panelSize.y - (row + 1) * ph;        // viewport origin: bottom left
        renderer.setViewport(col * pw, y, pw, ph);
        renderer.setScissor(col * pw, y, pw, ph);
        all.forEach((p, j) => { p.content.visible = j === i; });
        renderer.render(scene, camera);                // a panel without content (yet) is cleared
        if (cmpLabels[i]) {
          cmpLabels[i].style.left = `${rect.left + col * pw + 8}px`;
          cmpLabels[i].style.top = `${rect.top + row * ph + 8}px`;
        }
      }
      all.forEach((p, j) => { p.content.visible = j === 0; });
      renderer.setScissorTest(false);
      renderer.setViewport(0, 0, panelSize.x, panelSize.y);
    }

    // --- Scene stepping in XR (A = next, B = previous; see XRSceneController) ---
    // The page can't reload without ending the XR session, so swap the splat in
    // place; when the session ends on a different scene, reload into it so the
    // desktop camera/meta match.
    const initialScene = file;
    let sceneList = null;
    let switching = false;
    async function stepScene(delta, name = null) {
      if (switching) return;
      switching = true;
      try {
        if (!sceneList) sceneList = await (await fetch('/scenes')).json();
        if (sceneList.length === 0) return;
        if (name) {  // a scene picked in the gallery
          file = name;
        } else if (delta !== 0) {  // 0 reloads the current scene
          const idx = sceneList.indexOf(file);
          file = sceneList[(idx + delta + sceneList.length) % sceneList.length];
        }
        // Keep the old scene visible until the next one is loaded.
        const wasPano = isPanoScene(splat?.userData?.scene ?? initialScene);
        const next = await loadContent(file);
        next.userData.scene = file;
        await prepareView(next, file);
        applyVisibility(next);
        xrContent.add(next);
        xrContent.remove(splat);
        depthWarp.detach(splat);
        disposeContent(splat);
        splat = next;
        // A panorama is centred on your head (and a photo scene back in front of you after one).
        if (renderer.xr.isPresenting && (isPanoScene(file) || wasPano)) xrController.resetPlacement();
        const url = new URL(window.location);
        url.searchParams.set('scene', file);
        if (isPanoScene(file)) url.searchParams.set('pmode', panoMode);
        else url.searchParams.set('lod', lodMode);
        history.replaceState(null, '', url);
        if (hzAuto && renderer.xr.isPresenting) requestHz(120, false);   // re-check the rate for the new scene
      } catch (e) {
        console.error('Scene switch failed:', e);
      } finally {
        switching = false;
      }
    }
    const initialLod = lodMode, initialPanoMode = panoMode;
    renderer.xr.addEventListener('sessionend', () => {
      if (file !== initialScene || lodMode !== initialLod || panoMode !== initialPanoMode) window.location.reload();
    });

    // In-XR scene gallery (secondary A/X; see web/js/XRGallery.js). Picking a
    // view mode reloads the current scene in that mode.
    const xrGallery = new XRGallery(renderer, scene, {
      listScenes: async () => (sceneList = await (await fetch('/scenes')).json()),
      sceneModes: async () => (await fetch('/scene-modes')).json(),
      thumbUrl: (name) => `/thumb/${encodeURIComponent(name)}`,
      current: () => file,
      // View modes of the current scene's kind; each cell is greyed by its own kind's mode.
      lod: () => isPanoScene(file) ? panoMode : lodMode,
      lods: () => isPanoScene(file) ? PANO_MODES : VIEW_MODES,
      available: (name, modes) => isPanoScene(name) ? (modes ?? []).includes(panoMode)
                                                    : (modes ?? ['full']).includes(lodMode),
      isPano: isPanoScene,
      isPrivate: (name) => name.startsWith('private:'),
      onSelectScene: async (name) => {
        xrGallery.close();
        if (name !== file) await stepScene(0, name);
      },
      onSelectLod: (id) => isPanoScene(file) ? switchPanoMode(id) : switchLod(id),
    });

    // View-mode switching in XR (gallery buttons):
    // reload the current scene in the new mode and show its name briefly.
    const xrToast = new XRToast(renderer, scene);
    const modeLabel = (id) => ([...VIEW_MODES, ...PANO_MODES].find((m) => m.id === id) || { label: id }).label;
    async function switchPanoMode(id) {
      if (id === panoMode || switching) return;
      panoMode = id;
      xrGallery.refresh();
      xrToast.show(`${modeLabel(id)}…`, 30);
      await stepScene(0);
      xrToast.show(modeLabel(panoMode));
    }
    async function switchLod(id) {
      if (id === lodMode || switching) return;
      lodMode = id;
      xrGallery.refresh();
      xrToast.show(`${modeLabel(id)}…`, 30);
      await stepScene(0);
      xrToast.show(modeLabel(lodMode));
    }

    // Delete the current scene from the XR menu: switch to the next scene
    // first, then delete the old one's files on the server.
    async function deleteCurrentScene() {
      const victim = file;
      if (isPanoScene(victim)) { xrToast.show('Panoramas are not deleted here', 2); return; }
      if (!sceneList) sceneList = await (await fetch('/scenes')).json();
      if (sceneList.length <= 1) return;
      await stepScene(1);
      if (file === victim) return;  // switch didn't happen
      try {
        await fetch('/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ scene: victim }),
        });
        sceneList = sceneList.filter((name) => name !== victim);
      } catch (e) {
        console.error('Delete failed:', e);
      }
    }

    // XR controls (ported from img3dviewer's XRMeshController); button map in
    // web/js/XRSceneController.js.
    const xrController = new XRSceneController(renderer, camera, scene, {
      group: xrRoot,
      content: xrContent,
      FontLoader,
      TextGeometry,
      onStepScene: (delta) => stepScene(delta),
      onReloadScene: () => stepScene(0),
      onExit: () => renderer.xr.getSession()?.end(),
      onDeleteScene: () => deleteCurrentScene(),
      gallery: xrGallery,
      isPano: () => isPanoScene(file),
      // Left trigger / grip + controller motion along the gaze: depth offset (forward = farther, by the
      // scene's typical depth per metre) / depth scale (forward = flatter).
      depth: {
        nudge: (kind, metres) => {
          if (kind === 'offset') viewCfg.depthOffset += metres * depthWarp.get().pivot;
          else viewCfg.depthScale = THREE.MathUtils.clamp(viewCfg.depthScale * Math.exp(-1.5 * metres), 0.05, 8);
          applyViewConfig();
          xrToast.show(viewLabel(), 1.2);
        },
      },
      onViewChange: () => {
        if (!isPanoScene(viewScene)) viewCfg.scale = xrRoot.scale.x;
        saveViewConfig();
      },
      onResetView: () => {
        viewCfg = { ...VIEW_DEFAULTS };
        applyViewConfig();
        saveViewConfig();
        xrToast.show('Scale & depth reset', 1.5);
      },
    });
    // Centre the scene on the headset shortly after entering XR (like pressing
    // the trigger): the 'local' origin isn't reliably where your head is, and
    // tracking needs a moment to settle.
    // ?hz=120 (or 72, 90): ask the headset for that display rate if it supports it (Quest 3: 72/90/120);
    // the rate granted is shown briefly and logged with every FPS report (refreshHz).
    // Display rate. Default: ask for 120 Hz (Quest 3) and measure for 2 s after each scene loads; if the scene
    // can't keep up (< 108 fps) drop to 90 Hz, since a steady 90 is smoother than missed frames at 120.
    // ?hz=72|90|120 forces that rate instead.
    const hzParam = getQueryParam('hz');
    const hzAuto = !hzParam;
    const targetHz = parseFloat(hzParam || '120');
    let hzCheck = null;                                 // { t0, frames } while measuring at 120 Hz
    function requestHz(hz, announce = true) {
      const session = renderer.xr.getSession();
      if (!session?.updateTargetFrameRate) return;
      const rates = session.supportedFrameRates || [];
      if (!rates.includes(hz)) {
        if (!hzAuto) xrToast.show(`${hz} Hz not available (${rates.join('/') || '?'}); running at ${session.frameRate ?? '?'} Hz`, 5);
        return;
      }
      session.updateTargetFrameRate(hz).then(() => {
        if (announce) xrToast.show(`${session.frameRate ?? hz} Hz`, 2);
        hzCheck = hzAuto && hz === 120 ? { t0: performance.now() + 2500, frames: 0 } : null;
      }).catch(() => {});
    }
    function checkHz() {
      if (!hzCheck || !renderer.xr.isPresenting) return;
      const now = performance.now();
      if (now < hzCheck.t0) return;                     // let the scene settle first
      hzCheck.frames++;
      if (now - hzCheck.t0 < 2000) return;
      const fps = hzCheck.frames * 1000 / (now - hzCheck.t0);
      hzCheck = null;
      if (fps < 108) {
        requestHz(90, false);
        xrToast.show(`90 Hz (this scene runs ${Math.round(fps)} fps at 120)`, 3);
      }
    }
    renderer.xr.addEventListener('sessionstart', () => {
      requestHz(targetHz);
      xrController.applyHome();
      applyViewConfig();                     // the scene's own size
      setTimeout(() => {
        if (renderer.xr.isPresenting) xrController.resetPlacement();
      }, 500);
    });
    renderer.xr.addEventListener('sessionend', () => xrController.resetAll());

    let meshObj = null;

    let guiParams = {
      cameraMotion: "None",
      amplitude: 2,
      speed: 1,
      center: 50,
      showMesh: true,
      showSplat: true,
      sortOnce: true
    };
    applyVisibility(splat);

    if (hybrid == "true") {
      /*
      const loader = new PLYLoader();
      loader.load(meshURL, function (geometry) {
        geometry.computeVertexNormals();
        // If your PLY has vertex colors, use vertexColors: true
        const material = new THREE.MeshBasicMaterial({ vertexColors: true });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.quaternion.set(1, 0, 0, 0);
        mesh.position.set(0, 0, 0);
        mesh.visible = guiParams.showMesh;
        scene.add(mesh);
        meshObj = mesh;
        // alert("added");
      });
      */
      const loader = new GLTFLoader();
      loader.load(meshURL, function (gltf) {
        const model = gltf.scene;
        model.quaternion.set(1, 0, 0, 0);
        model.position.set(0, 0, 0);
        model.visible = guiParams.showMesh;
        xrContent.add(model);
        meshObj = model;


        model.traverse((child) => {
          if (child.isMesh) {
              // Grab the original PBR material created by the loader
              const originalMaterial = child.material;
              // const hasVertexColors = child.geometry.attributes.color !== undefined;
              // const hasVertexColors = false;

              child.material = new THREE.MeshBasicMaterial({
                  map: originalMaterial.map, // This is your UV texture
                  // color: originalMaterial.color,
                  // vertexColors: hasVertexColors,
                  side: THREE.DoubleSide,    // Ensures both sides of faces are visible
                  // transparent: true,
              });

              if (child.material.map) {
                  child.material.map.colorSpace = THREE.SRGBColorSpace;
              }
          }
        });


      });
      scene.add(new THREE.AmbientLight(0xffffff, 1.0)); // Full ambient, no shadows

    }

    const gui = new dat.GUI();

    // Model picker (desktop): every model of this scene (view modes and variant bakes, /scene-models); picking
    // one reloads the page with it.
    if (!isPano) {
      const pick = document.createElement('select');
      pick.id = 'model-pick';
      pick.title = 'Model of this scene';
      Object.assign(pick.style, { position: 'fixed', top: '10px', left: '200px', zIndex: 1000, font: '13px sans-serif',
                                  padding: '4px 6px', borderRadius: '6px', background: 'rgba(20,20,20,0.85)',
                                  color: '#fff', border: '1px solid #555' });
      document.body.appendChild(pick);
      const curVar = (getQueryParam('mpivar') || '').replace(/[^a-z0-9]/gi, '');
      fetch(`/scene-models/${encodeURIComponent(file)}`).then((r) => r.json()).then((models) => {
        for (const m of models) {
          const o = document.createElement('option');
          o.value = JSON.stringify(m);
          const base = (VIEW_MODES.find((v) => v.id === m.lod) || { label: m.lod }).label;
          o.textContent = isVariant(m.lod) && !VIEW_MODES.some((v) => v.id === m.lod) ? `MPI-only: ${m.lod}` : base;
          o.selected = m.lod === (lodList[0] === 'mpionly' && curVar ? curVar : lodList[0]);
          pick.appendChild(o);
        }
      }).catch(() => pick.remove());
      pick.addEventListener('change', () => {
        const m = JSON.parse(pick.value);
        const url = new URL(window.location);
        url.searchParams.set('lod', m.lod);
        url.searchParams.delete('mpivar');
        window.location.href = url.toString();
      });
    }
    // Depth sliders (both kinds of scene), saved per scene like the XR controls.
    const depthParams = {
      get depthScale() { return viewCfg.depthScale; },
      set depthScale(v) { viewCfg.depthScale = v; applyViewConfig(); saveViewConfig(); },
      get depthOffset() { return viewCfg.depthOffset; },
      set depthOffset(v) { viewCfg.depthOffset = v; applyViewConfig(); saveViewConfig(); },
      reset() { viewCfg = { ...viewCfg, depthScale: 1, depthOffset: 0 }; applyViewConfig(); saveViewConfig(); },
    };
    function addDepthControls() {
      gui.add(depthParams, 'depthScale', 0.05, 4, 0.01).name('depth scale').listen();
      gui.add(depthParams, 'depthOffset', -10, 10, 0.01).name('depth offset (m)').listen();
      gui.add(depthParams, 'reset').name('reset depth');
    }
    if (isPano) {
      // Panorama options: what to show and how far you may move (look around by dragging).
      const reloadPano = () => stepScene(0);
      const variants = Object.fromEntries((panoInfo?.variants ?? []).map((v) => [v.label, v.id]));
      const panoParams = {
        view: panoMode,
        variant: panoVariant || panoInfo?.variants?.[0]?.id || '',
        moveLimit: panoLook.maxMove,
        fov: panoLook.fov,
        wiggle: false,
        reset: () => panoLook.reset(),
      };
      gui.add(panoParams, 'view', { 'Multi-sphere image': 'msi', 'Splats': 'splats' }).name('360 view')
        .onChange((v) => { panoMode = v; reloadPano(); });
      if (Object.keys(variants).length > 1) {
        gui.add(panoParams, 'variant', variants).name('MSI variant')
          .onChange((v) => { panoVariant = v; if (panoMode === 'msi') reloadPano(); });
      }
      gui.add(panoParams, 'moveLimit', 0.1, 2, 0.05).name('move limit (m)').onChange((v) => { panoLook.maxMove = v; });
      gui.add(panoParams, 'fov', 30, 110, 1).name('FOV').listen().onChange((v) => { panoLook.fov = v; });
      gui.add(panoParams, 'wiggle').name('wiggle (parallax)').onChange((v) => { panoLook.wiggle = v; });
      gui.add(panoParams, 'reset').name('back to centre (R)');
      addDepthControls();
      setInterval(() => { panoParams.fov = panoLook.fov; }, 250);
      const help = document.createElement('div');
      help.id = 'pano-help';
      help.innerHTML = '<b>360°</b> Drag: look around · WASD / arrows: move · Q / E: down / up · ' +
                       'right-drag: slide · wheel: zoom · R: centre';
      document.body.appendChild(help);
    } else {
    gui.add(guiParams, 'cameraMotion', ["None", "SpiralXYZ", "SpiralXY", "Dolly"]);
    gui.add(guiParams, 'amplitude', 0, 20, 0.1);
    gui.add(guiParams, 'speed', 0.1, 5, 0.1);
    gui.add(guiParams, 'center', 0, 99, 1).onChange((value) => {
      center_depth = 1/linspace[Math.floor(value)];
      let new_center = new THREE.Vector3(0, 0, -center_depth);
      controls.target.copy(new_center);
      controls.update();
    });
    gui.add(guiParams, 'showMesh').onChange((value) => {
      if (meshObj) meshObj.visible = value;
      applyVisibility(splat);
    });
    gui.add(guiParams, 'showSplat').onChange(() => applyVisibility(splat));
    gui.add(guiParams, 'sortOnce').onChange(setSortOnce);
    addDepthControls();
    }
    if (ui === "false") {
      gui.hide();
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (guiParams.cameraMotion != "None") {
          guiParams.cameraMotion = "None";
          gui.updateDisplay();
        } else if (isPano) {
          panoLook.reset();
        } else {
          resetView();
        }
      }
    });

    // --- Automatic orbit centre, computed at run time from the loaded scene ---
    // The meta-based centre (disparity midpoint of min/max depth) is thrown
    // off by stray near/far splats. Instead: project splat centres
    // (subsampled) and mesh vertices into a coarse screen grid from the input
    // camera, keep the nearest depth per cell (~ the visible surface), and
    // orbit around a low percentile of those depths over the middle of the
    // view -- the foreground subject rather than the sky behind it.
    // ?autoorbit=false keeps the meta-based centre.
    function setOrbitDepth(d) {
      median_depth = d;  // resetView() (Space) returns here
      center_depth = d;
      controls.target.set(0, 0, -d);
      initialDistance = d;  // dolly zoom is relative to the input camera at the origin
      dollyConstant = initialDistance * Math.tan(initialFov / 2);
      // Keep the GUI 'center' slider on the nearest of its preset depths.
      let best = 0;
      for (let i = 1; i < linspace.length; i++) {
        if (Math.abs(1 / linspace[i] - d) < Math.abs(1 / linspace[best] - d)) best = i;
      }
      guiParams.center = best;
      gui.updateDisplay();
      controls.update();
    }

    async function autoOrbitCenter() {
      const t0 = performance.now();
      const GX = 40, GY = 30;
      const nearest = new Float32Array(GX * GY).fill(Infinity);
      const tanY = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
      const tanX = tanY * camera.aspect;
      const p = new THREE.Vector3();
      // World-space point; the input camera is at the origin looking down -z.
      const addPoint = (v) => {
        const z = -v.z;
        if (z <= 0.05) return;
        const gx = Math.floor((v.x / z / tanX * 0.5 + 0.5) * GX);
        const gy = Math.floor((-v.y / z / tanY * 0.5 + 0.5) * GY);
        if (gx < 0 || gx >= GX || gy < 0 || gy >= GY) return;
        const k = gy * GX + gx;
        if (z < nearest[k]) nearest[k] = z;
      };
      const splatObjs = [], meshObjs = [];
      splat.traverse((c) => {
        if (c instanceof SplatMesh) splatObjs.push(c);
        else if (c.isMesh) meshObjs.push(c);
      });
      for (const sm of splatObjs) {
        await sm.initialized;
        sm.updateMatrixWorld(true);
        const stride = Math.max(1, Math.ceil((sm.numSplats || 0) / 200000));
        sm.forEachSplat((i, center, scales, quaternion, opacity) => {
          if (i % stride || opacity < 0.5) return;
          addPoint(p.copy(center).applyMatrix4(sm.matrixWorld));
        });
      }
      for (const m of meshObjs) {
        m.updateMatrixWorld(true);
        const pos = m.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) addPoint(p.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld));
      }
      // Central 60% of the view.
      const depths = [];
      for (let gy = Math.floor(GY * 0.2); gy < Math.ceil(GY * 0.8); gy++) {
        for (let gx = Math.floor(GX * 0.2); gx < Math.ceil(GX * 0.8); gx++) {
          const d = nearest[gy * GX + gx];
          if (Number.isFinite(d)) depths.push(d);
        }
      }
      if (depths.length < 10) {
        console.warn('Auto orbit centre: not enough samples; keeping', median_depth);
        return;
      }
      depths.sort((a, b) => a - b);
      const d = depths[Math.floor(0.4 * (depths.length - 1))];
      console.log(`Auto orbit centre: ${d.toFixed(2)} m (meta-based ${median_depth.toFixed(2)} m), ` +
                  `${depths.length} cells, ${(performance.now() - t0).toFixed(0)} ms`);
      setOrbitDepth(d);
    }

    if (!isPano && getQueryParam('autoorbit') !== 'false') {
      autoOrbitCenter().catch((e) => console.warn('Auto orbit centre failed:', e));
    }

    let lastFrame = performance.now();
    renderer.setAnimationLoop(function animate(time) {
      const frameStart = performance.now();
      const dt = Math.min((frameStart - lastFrame) / 1000, 0.1);
      lastFrame = frameStart;
      stats.begin();
      xrController.update();
      xrToast.update();
      checkHz();
      if (xrBench) xrBench.step(performance.now());
      if (flatSplats) flatSplats.sync();
      reportXRFps();
      adaptQuality(performance.now());
      // let amplitude = guiParams.amplitude * 0.005 * distance;
      let amplitude = guiParams.amplitude * 0.05;
      let speed = guiParams.speed * 0.001;
      let cameraMotion = isPano ? "Pano" : guiParams.cameraMotion;
      if (cameraMotion === "Pano") {
        if (!renderer.xr.isPresenting) panoLook.update(dt, frameStart);
      } else if (cameraMotion === "SpiralXYZ") {
        camera.position.x = amplitude * Math.sin(time * speed) * 1.5;
        camera.position.y = 0.5 * amplitude * Math.sin(2 * time * speed) * 1.5;
        camera.position.z = 2 * amplitude * (Math.sin(0.5 * time * speed) - 1);
      } else if (cameraMotion === "SpiralXY") {
        camera.position.x = amplitude * Math.sin(time * speed);
        camera.position.y = 0.5 * amplitude * Math.sin(2 * time * speed);
      } else if (cameraMotion === "Dolly") {
      // use oldPosition
        // let delta = amplitude * Math.sin(time * speed);
        let delta = 0.5 + 0.5 * Math.sin(time * speed);
        delta = -delta * 1.5 + 1.5;

        camera.position.copy(oldPosition).addScaledVector(dolly_dir, delta);

        const newDistance = camera.position.distanceTo(target);
        const newFov = 2 * Math.atan(dollyConstant / newDistance);
        camera.fov = THREE.MathUtils.radToDeg(newFov);
        camera.updateProjectionMatrix();

        controls.update();
      }
      if (!isPano) controls.update();
      if (cmpLabels.length && !renderer.xr.isPresenting) renderPanels();
      else renderer.render(scene, camera);
      // splat.rotation.y += 0.01;
      stats.end();
      if (renderer.xr.isPresenting) {
        sparkStats.cpuMs.push(performance.now() - frameStart);
        sparkStats.frames++;
      }
    });
  </script>
